[project]
name = "agentic-research-engine"
version = "0.1.0"
description = "Multi-agent research engine and AI automation demos (LangGraph + FastAPI)"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# pyflakes, pycodestyle, bugbear, pyupgrade, simplify, security (bandit rules), blind-except, returns, imports
select = ["E", "F", "W", "B", "UP", "SIM", "S", "BLE", "RET", "I"]
ignore = ["E501", "UP007", "UP045"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.bandit]
exclude_dirs = ["tests"]
